# .github/workflows/ci-build.yml
# Simplified CI for faster incremental builds.
#
# Optimization strategy:
#   1. Restore individual package caches (lolly, libiconv, libjpeg, etc.)
#      keyed on hashFiles('xmake.lua', 'xmake/packages.lua') so only
#      dependency changes bust the cache.
#   2. Restore entire build/ directory for incremental object reuse.
#   3. Use the valid xmake target stem (no fake matrix targets).
#
# Expected times (windows-2025):
#   First run (cold):  ~30-35 min
#   Incremental:       ~5-8 min

name: Mogan CI (Build Matrix)

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'TeXmacs/**'
      - 'xmake.lua'
      - 'xmake/packages.lua'
      - 'xmake/*.lua'
      - '.github/workflows/ci-build.yml'
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 🗑️ 清除缓存
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-windows
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      # ----------------------------------------------------------------
      # 0. Clear caches (if requested)
      # ----------------------------------------------------------------
      - name: Clear cache
        if: ${{ github.event.inputs.clear_cache == 'true' }}
        run: |
          Remove-Item -Recurse -Force "${{ github.workspace }}\.xmake-global" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "${{ github.workspace }}\build" -ErrorAction SilentlyContinue

      # ----------------------------------------------------------------
      # 1. Checkout + xmake setup
      # ----------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: v3.0.4

      - name: Update repo
        run: xrepo update-repo

      - name: Set xmake global dir
        run: echo "XMAKE_GLOBALDIR=${{ github.workspace }}\.xmake-global" >> $env:GITHUB_ENV

      # ----------------------------------------------------------------
      # 2. Per-package caches (granular, only bust on dep changes)
      # ----------------------------------------------------------------
      - name: Restore xrepo packages cache
        id: cache-packages
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}\.xmake-global\.xmake\packages
            ${{ github.workspace }}\.xmake-global\.xmake\cache
          key: xmake-${{ runner.os }}-${{ runner.arch }}-packages-${{ hashFiles('xmake.lua', 'xmake/packages.lua', 'xmake/*.lua') }}
          restore-keys: |
            xmake-${{ runner.os }}-${{ runner.arch }}-packages-

      # ----------------------------------------------------------------
      # 3. Build-directory cache (incremental object reuse)
      # ----------------------------------------------------------------
      - name: Restore build cache
        id: cache-build
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}\build
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('xmake.lua', 'xmake/packages.lua', 'xmake/*.lua') }}
          restore-keys: |
            build-${{ runner.os }}-${{ runner.arch }}-

      # ----------------------------------------------------------------
      # 3.5 ccache cache (content-hash incremental, immune to mtime)
      #     key uses sha: one entry per commit; restore-keys falls back
      #     to the most recent one.
      # ----------------------------------------------------------------
      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}\.ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      # ----------------------------------------------------------------
      # 4. Configure
      # ----------------------------------------------------------------
      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}\.ccache
        run: |
          xmake config --yes -vD -m release `
            --text_toolbar=false `
            --tutorial=false `
            --debug_with_timestamp=false

      # ----------------------------------------------------------------
      # 5. Build (only the stem target — the real Mogan executable)
      #    Note: -m is a config option, NOT a build option; mode is
      #    already fixed by xmake config -m release above.
      # ----------------------------------------------------------------
      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}\.ccache
        run: |
          xmake build -vD stem
          Write-Host "✅ Build done"

      # ----------------------------------------------------------------
      # 6. Install
      # ----------------------------------------------------------------
      - name: Install
        run: |
          xmake install -vD stem
          Write-Host "✅ Install done"

      # ----------------------------------------------------------------
      # 7. Install Pandoc, Ghostscript, Noto fonts
      # ----------------------------------------------------------------
      - name: Install pandoc, ghostscript, Noto fonts
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          scoop install wget pandoc ghostscript --global

          $pandocSrc = "$env:ProgramData\scoop\apps\pandoc\current\pandoc.exe"
          $pandocDst = "${{ github.workspace }}\build\packages\stem\data\bin\pandoc.exe"
          if (Test-Path $pandocSrc) {
            Copy-Item $pandocSrc $pandocDst -Force
            Write-Host "✅ pandoc copied"
          }

          $fontDir = "${{ github.workspace }}\TeXmacs\fonts\opentype\noto"
          New-Item -ItemType Directory -Force -Path $fontDir | Out-Null
          $fonts = @(
            "https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSansCJK-Bold.ttc",
            "https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSansCJK-Regular.ttc",
            "https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSerifCJK-Bold.ttc",
            "https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/NotoSerifCJK-Regular.ttc"
          )
          foreach ($url in $fonts) {
            $fn = Split-Path $url -Leaf
            wget -q $url -O "$fontDir\$fn"
            Write-Host "✅ Downloaded $fn"
          }

          $gsDst = "${{ github.workspace }}\build\packages\stem\data\bin\gs.exe"
          wget -q "https://github.com/XmacsLabs/mogan/releases/download/v1.2.9.7/gs.exe" -O $gsDst 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "✅ gs.exe downloaded"
          } else {
            Write-Host "⚠️ gs.exe download returned exit $LASTEXITCODE (non-fatal, continuing)"
          }

      # ----------------------------------------------------------------
      # 8. Generate installer
      # ----------------------------------------------------------------
      - name: Generate Installer
        run: |
          xmake pack --yes -vD stem
          Write-Host "✅ Pack done"

      # ----------------------------------------------------------------
      # 9. Inspect outputs
      # ----------------------------------------------------------------
      - name: Inspect outputs
        shell: pwsh
        run: |
          Write-Host "=== Installer ==="
          $packDir = "build\xpack\stem"
          if (Test-Path $packDir) {
            Get-ChildItem -Path $packDir -Filter "*.exe" | Select-Object Name, Length
          }
          Write-Host ""
          Write-Host "=== Package directory ==="
          $pkgDir = "build\packages\stem"
          if (Test-Path $pkgDir) {
            Get-ChildItem -Path $pkgDir -Recurse -Include *.exe,*.dll | Group-Object Extension |
              Select-Object Count, Name
          }

      # ----------------------------------------------------------------
      # 10. Upload artifacts
      # ----------------------------------------------------------------
      - name: Upload Installer (Artifact)
        uses: actions/upload-artifact@v7
        with:
          name: mogan-turbo-windows-installer
          path: build/xpack/stem/*.exe
          retention-days: 7
          compression-level: 1

      - name: Package portable ZIP
        shell: pwsh
        run: |
          $pkgDir = "build\packages\stem"
          if (Test-Path $pkgDir) {
            Compress-Archive -Path "$pkgDir\*" -DestinationPath mogan-turbo-portable.zip -Force
            Write-Host "✅ Portable ZIP created"
          }

      - name: Upload Portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: mogan-turbo-windows-portable
          path: mogan-turbo-portable.zip
          retention-days: 7
          compression-level: 1

      # ----------------------------------------------------------------
      # 11. Create Release
      # ----------------------------------------------------------------
      - name: Generate release tag
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyyMMdd"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $tag = "build-$date-$sha"
          echo "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create "${{ env.RELEASE_TAG }}" `
            --repo ${{ github.repository }} `
            --title "Mogan Build ${{ env.RELEASE_TAG }}" `
            --notes "Automatic build #${{ github.run_number }}." `
            --target ${{ github.sha }}

          $installer = Get-Item "build\xpack\stem\*.exe" | Select-Object -First 1
          if ($installer) {
            gh release upload "${{ env.RELEASE_TAG }}" $installer.FullName --repo ${{ github.repository }}
          }
          if (Test-Path "mogan-turbo-portable.zip") {
            gh release upload "${{ env.RELEASE_TAG }}" "mogan-turbo-portable.zip" --repo ${{ github.repository }}
          }
          Write-Host "✅ Release created/updated"

      # ----------------------------------------------------------------
      # 12. Save caches (each key saved separately so restore can find them)
      # ----------------------------------------------------------------
      - name: Save xrepo packages cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}\.xmake-global\.xmake\packages
            ${{ github.workspace }}\.xmake-global\.xmake\cache
          key: ${{ steps.cache-packages.outputs.cache-primary-key }}

      - name: Save build cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\build
          key: ${{ steps.cache-build.outputs.cache-primary-key }}

      - name: Save ccache cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}\.ccache
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

      # ----------------------------------------------------------------
      # 13. Summary
      # ----------------------------------------------------------------
      - name: Summary
        if: always()
        run: |
          Write-Host "========================================="
          Write-Host "  ✅ Mogan CI Build Complete"
          Write-Host "  Run #: ${{ github.run_number }}"
          Write-Host "========================================="